name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  
  # Allows manual workflow triggering from GitHub Actions tab
  workflow_dispatch:
  
  # Run on every push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate Snake SVG files
      - name: Generate Contribution Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            images/github-contribution-grid-snake.svg
            images/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 3: Push generated files to output branch for external access
      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Commit updated images to main branch
      - name: Commit updated snake SVGs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/github-contribution-grid-snake.svg images/github-contribution-grid-snake-dark.svg || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update contribution snake animation [skip ci]" && git push)
