<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background & Window Gradients -->
    <linearGradient id="term-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="header-bg-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="text-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animation for Blinking Terminal Cursor -->
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; }
    </style>
  </defs>

  <!-- Outer Window Container -->
  <rect width="850" height="260" rx="14" fill="url(#term-bg-dark)" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Window Header Bar -->
  <rect width="850" height="38" rx="14" fill="url(#header-bg-dark)" />
  <!-- Bottom square corners overlay for header -->
  <rect y="24" width="850" height="14" fill="url(#header-bg-dark)" />
  <line x1="0" y1="38" x2="850" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Window Traffic Light Control Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56" />
  <circle cx="44" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="19" r="6" fill="#27c93f" />

  <!-- Terminal Title Text -->
  <text x="425" y="24" font-family="Fira Code, Consolas, Monaco, monospace" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">
    dineshkumar@dev: ~/portfolio (zsh)
  </text>

  <!-- Terminal Content Area -->
  
  <!-- Line 1: prompt whoami -->
  <g transform="translate(30, 72)">
    <text font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#4ade80">dineshkumar@dev</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" fill="#8b949e">:</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#38bdf8">~/portfolio</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" fill="#f3f4f6">$ whoami</text>
  </g>

  <!-- Line 2: Output - Name -->
  <g transform="translate(30, 108)">
    <text font-family="Fira Code, Consolas, monospace" font-size="28" font-weight="900" fill="url(#text-grad-dark)" filter="url(#glow-dark)">
      DINESHKUMAR M
    </text>
    <text font-family="Fira Code, Consolas, monospace" font-size="28" font-weight="900" fill="url(#text-grad-dark)">
      DINESHKUMAR M
    </text>
  </g>

  <!-- Line 3: Output - Subtitle -->
  <g transform="translate(30, 138)">
    <text font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="600" fill="#94a3b8">
      &gt; Software Developer | Full-Stack Engineer | Web Designer
    </text>
  </g>

  <!-- Line 4: prompt cat tech_stack.json -->
  <g transform="translate(30, 172)">
    <text font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#4ade80">dineshkumar@dev</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" fill="#8b949e">:</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#38bdf8">~/portfolio</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" fill="#f3f4f6">$ cat tech_stack.json</text>
  </g>

  <!-- Line 5: Tech stack JSON output -->
  <g transform="translate(30, 202)">
    <text font-family="Fira Code, Consolas, monospace" font-size="13" fill="#e2e8f0">
      &gt; ["React", "Next.js", "Node.js", "Express", "MongoDB", "Flutter", "Tailwind"]
    </text>
  </g>

  <!-- Line 6: Active prompt line with blinking cursor -->
  <g transform="translate(30, 234)">
    <text font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#4ade80">dineshkumar@dev</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" fill="#8b949e">:</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" font-weight="700" fill="#38bdf8">~/portfolio</text>
    <text font-family="Fira Code, Consolas, monospace" font-size="14" fill="#f3f4f6">$ </text>
    <!-- Blinking Cursor -->
    <rect class="cursor" x="222" y="-12" width="9" height="16" fill="#00f2fe" />
  </g>

  <!-- Right Side Decorative Graphic Badge -->
  <g transform="translate(710, 65)">
    <rect width="110" height="165" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="55" cy="55" r="32" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <!-- Developer Icon -->
    <path d="M 45 48 L 37 55 L 45 62 M 65 48 L 73 55 L 65 62 M 57 44 L 53 66" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="55" y="112" font-family="Fira Code, Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">AVAILABLE</text>
    <text x="55" y="132" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#4ade80" text-anchor="middle">● FOR HIRE</text>
    <text x="55" y="150" font-family="Fira Code, Consolas, monospace" font-size="10" fill="#8b949e" text-anchor="middle">v2.4.0</text>
  </g>
</svg>
