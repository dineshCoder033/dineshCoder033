<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Terminal Background Gradient -->
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Top Header Bar Gradient -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="cyan-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Glowing Border Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Halftone / Grid Pattern -->
    <pattern id="halftone-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#00bcd4" opacity="0.25" />
    </pattern>
    <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <!-- Blinking Cursor Animation -->
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .blinking-cursor { animation: blink 1s infinite; }
      .pulse-red { animation: blink 1.5s infinite; }
    </style>
  </defs>

  <!-- Outer Window Box -->
  <rect width="1000" height="460" rx="14" fill="url(#bg-cyber)" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.6" filter="url(#subtle-glow)" />

  <!-- Top Terminal Header Bar -->
  <rect width="1000" height="40" rx="14" fill="url(#header-grad)" />
  <rect y="26" width="1000" height="14" fill="url(#header-grad)" />
  <line x1="0" y1="40" x2="1000" y2="40" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons (Red, Yellow, Green) -->
  <circle cx="24" cy="20" r="6" fill="#ff5f56" />
  <circle cx="44" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="20" r="6" fill="#27c93f" />

  <!-- Left Header Title Text -->
  <text x="90" y="25" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="13" font-weight="600" fill="#00bcd4">
    profile.sh --live
  </text>

  <!-- Right Header Live Status Badge -->
  <g transform="translate(900, 12)">
    <rect width="75" height="20" rx="10" fill="#21262d" stroke="#ff5f56" stroke-width="1" stroke-opacity="0.6" />
    <circle class="pulse-red" cx="15" cy="10" r="4" fill="#ff5f56" />
    <text x="26" y="14" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="700" fill="#ff5f56">LIVE</text>
  </g>

  <!-- ==================== LEFT PANEL (PORTRAIT & DITHER EFFECT) ==================== -->
  <g transform="translate(20, 55)">
    <!-- Container Card -->
    <rect width="280" height="385" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <rect width="280" height="385" rx="12" fill="url(#cyber-grid)" />
    <rect width="280" height="385" rx="12" fill="url(#halftone-dots)" />

    <!-- Cyan Glowing Corners -->
    <path d="M 10 25 L 10 10 L 25 10" fill="none" stroke="#00bcd4" stroke-width="2.5" />
    <path d="M 270 25 L 270 10 L 255 10" fill="none" stroke="#00bcd4" stroke-width="2.5" />
    <path d="M 10 360 L 10 375 L 25 375" fill="none" stroke="#00bcd4" stroke-width="2.5" />
    <path d="M 270 360 L 270 375 L 255 375" fill="none" stroke="#00bcd4" stroke-width="2.5" />

    <!-- Halftone Portrait Image -->
    <g transform="translate(15, 15)">
      <clipPath id="portrait-clip">
        <rect width="250" height="320" rx="8" />
      </clipPath>
      <image href="assets/portrait.png" width="250" height="320" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-clip)" />
      <!-- Cyan Cyber Overlay Grid -->
      <rect width="250" height="320" rx="8" fill="#00bcd4" opacity="0.08" style="mix-blend-mode: color-dodge;" />
    </g>

    <!-- Bottom Panel Label -->
    <rect x="15" y="342" width="250" height="28" rx="6" fill="#0d1117" stroke="#00bcd4" stroke-width="1" stroke-opacity="0.4" />
    <text x="140" y="360" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#00bcd4" text-anchor="middle">
      [ PORTRAIT // CYBER_DITHER_V2 ]
    </text>
  </g>

  <!-- ==================== CENTER PANEL (NAME & CORE INFO) ==================== -->
  <g transform="translate(320, 55)">
    <!-- Main Name Header -->
    <text x="0" y="42" font-family="'Fira Code', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="url(#cyan-text-grad)" filter="url(#cyan-glow)" letter-spacing="1">
      DINESHKUMAR M
    </text>
    <text x="0" y="42" font-family="'Fira Code', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="url(#cyan-text-grad)" letter-spacing="1">
      DINESHKUMAR M
    </text>

    <!-- Subtitle (Purple Text) -->
    <text x="0" y="70" font-family="'Fira Code', monospace" font-weight="700" font-size="16" fill="#a855f7" letter-spacing="0.5">
      Junior Software Developer
    </text>

    <!-- Terminal Command Box -->
    <g transform="translate(0, 92)">
      <rect width="380" height="68" rx="8" fill="#0d1117" stroke="#00bcd4" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="26" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#22c55e">
        &gt; Building scalable web apps
      </text>
      <text x="14" y="50" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#22c55e">
        &gt; Turning ideas into real products
      </text>
    </g>

    <!-- Large Tech Icons Section -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#8b949e">
        CORE TECH STACK
      </text>

      <!-- React Icon Card -->
      <g transform="translate(0, 12)">
        <rect width="82" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <image href="https://img.icons8.com/color/48/react-native.png" x="25" y="8" width="32" height="32" />
        <text x="41" y="54" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">React</text>
      </g>

      <!-- Next.js Icon Card -->
      <g transform="translate(94, 12)">
        <rect width="82" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <image href="https://img.icons8.com/color/48/nextjs.png" x="25" y="8" width="32" height="32" />
        <text x="41" y="54" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#f3f4f6" text-anchor="middle">Next.js</text>
      </g>

      <!-- Node.js Icon Card -->
      <g transform="translate(188, 12)">
        <rect width="82" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <image href="https://img.icons8.com/color/48/000000/nodejs.png" x="25" y="8" width="32" height="32" />
        <text x="41" y="54" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#22c55e" text-anchor="middle">Node.js</text>
      </g>

      <!-- Flutter Icon Card -->
      <g transform="translate(282, 12)">
        <rect width="82" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <image href="https://img.icons8.com/color/48/flutter.png" x="25" y="8" width="32" height="32" />
        <text x="41" y="54" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Flutter</text>
      </g>
    </g>

    <!-- Large Slogan Section -->
    <g transform="translate(0, 325)">
      <rect width="380" height="52" rx="10" fill="#161b22" stroke="#00bcd4" stroke-width="1" stroke-opacity="0.5" />
      <text x="190" y="32" font-family="'Fira Code', monospace" font-weight="900" font-size="20" text-anchor="middle">
        <tspan fill="#00bcd4">Code.</tspan>
        <tspan fill="#a855f7"> Learn.</tspan>
        <tspan fill="#22c55e"> Build.</tspan>
        <tspan fill="#eab308"> Repeat.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL (SYSTEM.INFO & INTERACTIVE TERMINAL) ==================== -->
  <g transform="translate(720, 55)">
    <!-- Panel Container -->
    <rect width="260" height="385" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />

    <!-- SYSTEM.INFO Header -->
    <rect width="260" height="32" rx="12" fill="#21262d" />
    <rect y="20" width="260" height="12" fill="#21262d" />
    <text x="15" y="21" font-family="'Fira Code', monospace" font-size="12" font-weight="800" fill="#00bcd4">
      [ SYSTEM.INFO ]
    </text>

    <!-- Info Table -->
    <g transform="translate(15, 48)" font-family="'Fira Code', monospace" font-size="12">
      <!-- Status -->
      <text x="0" y="15" fill="#8b949e">Status</text>
      <text x="105" y="15" font-weight="700" fill="#22c55e">ONLINE 🟢</text>
      <line x1="0" y1="25" x2="230" y2="25" stroke="#30363d" stroke-width="0.8" opacity="0.6" />

      <!-- Company -->
      <text x="0" y="42" fill="#8b949e">Company</text>
      <text x="105" y="42" font-weight="600" fill="#f3f4f6">GoMath Tech</text>
      <line x1="0" y1="52" x2="230" y2="52" stroke="#30363d" stroke-width="0.8" opacity="0.6" />

      <!-- Role -->
      <text x="0" y="69" fill="#8b949e">Role</text>
      <text x="105" y="69" font-weight="600" fill="#a855f7">Jr. Software Dev</text>
      <line x1="0" y1="79" x2="230" y2="79" stroke="#30363d" stroke-width="0.8" opacity="0.6" />

      <!-- Location -->
      <text x="0" y="96" fill="#8b949e">Location</text>
      <text x="105" y="96" font-weight="600" fill="#f3f4f6">Tamil Nadu 🇮🇳</text>
      <line x1="0" y1="106" x2="230" y2="106" stroke="#30363d" stroke-width="0.8" opacity="0.6" />

      <!-- Learning -->
      <text x="0" y="123" fill="#8b949e">Learning</text>
      <text x="105" y="123" font-weight="600" fill="#38bdf8">DSA, Next.js</text>
      <line x1="0" y1="133" x2="230" y2="133" stroke="#30363d" stroke-width="0.8" opacity="0.6" />

      <!-- Focus -->
      <text x="0" y="150" fill="#8b949e">Focus</text>
      <text x="105" y="150" font-weight="600" fill="#00bcd4">Full Stack</text>
      <line x1="0" y1="160" x2="230" y2="160" stroke="#30363d" stroke-width="0.8" opacity="0.6" />

      <!-- Github -->
      <text x="0" y="177" fill="#8b949e">Github</text>
      <text x="105" y="177" font-weight="600" fill="#eab308">dineshkumar0202</text>
    </g>

    <!-- Bottom Interactive Terminal Box -->
    <g transform="translate(15, 260)">
      <rect width="230" height="110" rx="8" fill="#0d1117" stroke="#00bcd4" stroke-width="1" stroke-opacity="0.4" />
      <text x="10" y="24" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#00bcd4">
        user@dineshkumar ~ $
      </text>
      <text x="10" y="46" font-family="'Fira Code', monospace" font-size="11" fill="#22c55e">
        &gt; npm start portfolio
      </text>
      <text x="10" y="68" font-family="'Fira Code', monospace" font-size="11" fill="#8b949e">
        [OK] System Ready!
      </text>
      <!-- Active Prompt with Blinking Cursor -->
      <text x="10" y="92" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#00bcd4">$ </text>
      <rect class="blinking-cursor" x="24" y="81" width="8" height="13" fill="#00bcd4" />
    </g>
  </g>
</svg>
