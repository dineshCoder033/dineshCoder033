<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="100%" height="100%">
  <defs>
    <linearGradient id="bottom-bar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>
  </defs>

  <!-- Background Box -->
  <rect width="1000" height="44" rx="8" fill="url(#bottom-bar-bg)" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />

  <!-- Left Quote -->
  <text x="16" y="27" font-family="'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#b877ff">
    💡 Striving to make the web a better place, one project at a time!
  </text>

  <!-- Right Metrics -->
  <g transform="translate(560, 0)" font-family="'Fira Code', monospace" font-size="11">
    <!-- Metric 1: Views -->
    <g transform="translate(0, 0)">
      <text x="0" y="27" fill="#38bdf8" font-size="13">👁</text>
      <text x="20" y="21" font-size="8" fill="#8b949e">Profile Views</text>
      <text x="20" y="33" font-size="11" font-weight="800" fill="#f3f4f6">1,234</text>
    </g>

    <!-- Metric 2: Followers -->
    <g transform="translate(140, 0)">
      <text x="0" y="27" fill="#38bdf8" font-size="13">👥</text>
      <text x="22" y="21" font-size="8" fill="#8b949e">Followers</text>
      <text x="22" y="33" font-size="11" font-weight="800" fill="#f3f4f6">120</text>
    </g>

    <!-- Metric 3: Stars -->
    <g transform="translate(280, 0)">
      <text x="0" y="27" fill="#ffd600" font-size="13">⭐</text>
      <text x="20" y="21" font-size="8" fill="#8b949e">Total Stars</text>
      <text x="20" y="33" font-size="11" font-weight="800" fill="#f3f4f6">298</text>
    </g>
  </g>
</svg>
