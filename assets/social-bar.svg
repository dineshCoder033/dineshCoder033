<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="100%" height="100%">
  <defs>
    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="90" fill="none" />

  <!-- Card 1: LinkedIn -->
  <g transform="translate(0, 5)">
    <a href="https://www.linkedin.com/in/dineshkumar93/" target="_blank">
      <rect width="235" height="80" rx="12" fill="#161b22" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.4" filter="url(#card-glow)" />
      <!-- Icon -->
      <g transform="translate(20, 20)">
        <rect width="40" height="40" rx="8" fill="#0a66c2" fill-opacity="0.2" stroke="#0a66c2" stroke-width="1" />
        <path d="M 28 30 V 22 A 3 3 0 0 0 25 19 A 3 3 0 0 0 22 22 V 30 M 17 30 V 19 M 17 14 H 17.01" fill="none" stroke="#0a66c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2, -1)"/>
      </g>
      <!-- Text Label & Username -->
      <text x="75" y="36" font-family="'Fira Code', sans-serif" font-size="14" font-weight="700" fill="#00bcd4">LinkedIn</text>
      <text x="75" y="56" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e">in/dineshkumar93</text>
    </a>
  </g>

  <!-- Card 2: Gmail -->
  <g transform="translate(255, 5)">
    <a href="mailto:dinesh.official.dev@gmail.com" target="_blank">
      <rect width="235" height="80" rx="12" fill="#161b22" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.4" filter="url(#card-glow)" />
      <!-- Icon -->
      <g transform="translate(20, 20)">
        <rect width="40" height="40" rx="8" fill="#ea4335" fill-opacity="0.2" stroke="#ea4335" stroke-width="1" />
        <path d="M 14 16 L 25 24 L 36 16 M 14 16 H 36 V 32 H 14 Z" fill="none" stroke="#ea4335" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-5, -4)"/>
      </g>
      <!-- Text Label & Username -->
      <text x="75" y="36" font-family="'Fira Code', sans-serif" font-size="14" font-weight="700" fill="#00bcd4">Gmail</text>
      <text x="75" y="56" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e">dinesh.official.dev</text>
    </a>
  </g>

  <!-- Card 3: Instagram -->
  <g transform="translate(510, 5)">
    <a href="https://www.instagram.com/itz.dinesh.dk/" target="_blank">
      <rect width="235" height="80" rx="12" fill="#161b22" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.4" filter="url(#card-glow)" />
      <!-- Icon -->
      <g transform="translate(20, 20)">
        <rect width="40" height="40" rx="8" fill="#e4405f" fill-opacity="0.2" stroke="#e4405f" stroke-width="1" />
        <rect x="15" y="15" width="20" height="20" rx="5" fill="none" stroke="#e4405f" stroke-width="2" transform="translate(-5, -5)"/>
        <circle cx="20" cy="20" r="4" fill="none" stroke="#e4405f" stroke-width="2"/>
        <circle cx="28" cy="12" r="1" fill="#e4405f"/>
      </g>
      <!-- Text Label & Username -->
      <text x="75" y="36" font-family="'Fira Code', sans-serif" font-size="14" font-weight="700" fill="#00bcd4">Instagram</text>
      <text x="75" y="56" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e">@itz.dinesh.dk</text>
    </a>
  </g>

  <!-- Card 4: Portfolio -->
  <g transform="translate(765, 5)">
    <a href="https://github.com/dineshkumar0202" target="_blank">
      <rect width="235" height="80" rx="12" fill="#161b22" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.4" filter="url(#card-glow)" />
      <!-- Icon -->
      <g transform="translate(20, 20)">
        <rect width="40" height="40" rx="8" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
        <path d="M 15 25 L 20 20 L 25 25 M 20 20 V 30 M 15 15 H 25" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2, -3)"/>
      </g>
      <!-- Text Label & Username -->
      <text x="75" y="36" font-family="'Fira Code', sans-serif" font-size="14" font-weight="700" fill="#00bcd4">Portfolio</text>
      <text x="75" y="56" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e">dineshkumar.dev</text>
    </a>
  </g>
</svg>
