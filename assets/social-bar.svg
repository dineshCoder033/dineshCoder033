        <!-- Badge -->
        <rect x="10" y="10" width="76" height="26" rx="4" fill="#0a66c2" />
        <text x="18" y="27" font-weight="800" fill="#ffffff">in</text>
        <text x="36" y="27" font-weight="700" fill="#ffffff">LinkedIn</text>
        <!-- Username Link -->
