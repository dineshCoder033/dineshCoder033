<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 135" width="100%" height="100%">
  <defs>
    <linearGradient id="snake-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>
  </defs>

  <!-- Left/Main Container: Contribution Snake (Width 660) -->
  <g transform="translate(0, 0)">
    <rect width="660" height="130" rx="8" fill="url(#snake-card-bg)" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
    <text x="12" y="22" font-family="'Fira Code', monospace" font-size="12" font-weight="800" fill="#22c55e">
      🐍 CONTRIBUTION SNAKE
    </text>

    <!-- Contribution Matrix Grid + Green Snake Path -->
    <g transform="translate(12, 36)">
      <!-- Embedded Snake Image / Dynamic Vector Snake Grid -->
      <image href="images/github-contribution-grid-snake-dark.svg" width="636" height="60" preserveAspectRatio="xMidYMid slice"/>
    </g>

    <!-- Snake Footer Text -->
    <text x="12" y="115" font-family="'Fira Code', monospace" font-size="10" fill="#22c55e">
      Let's eat some contributions! 🐍
    </text>
  </g>

  <!-- Right Container: Achievements (Width 325) -->
  <g transform="translate(675, 0)">
    <rect width="325" height="130" rx="8" fill="url(#snake-card-bg)" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
    <text x="12" y="22" font-family="'Fira Code', monospace" font-size="12" font-weight="800" fill="#00e5ff">
      🏆 ACHIEVEMENTS
    </text>

    <!-- Hexagonal Badges Grid (6 Hexagons) -->
    <g transform="translate(16, 40)">
      <!-- Hex 1: Pull Shark -->
      <g transform="translate(0, 0)">
        <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="#090d16" stroke="#a855f7" stroke-width="1.5" />
        <text x="18" y="26" font-family="'Fira Code', monospace" font-size="15" text-anchor="middle">🦈</text>
      </g>

      <!-- Hex 2: Quickdraw -->
      <g transform="translate(48, 0)">
        <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
        <text x="18" y="26" font-family="'Fira Code', monospace" font-size="15" text-anchor="middle">⚡</text>
      </g>

      <!-- Hex 3: YOLO -->
      <g transform="translate(96, 0)">
        <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="#090d16" stroke="#ffd600" stroke-width="1.5" />
        <text x="18" y="26" font-family="'Fira Code', monospace" font-size="15" text-anchor="middle">🎲</text>
      </g>

      <!-- Hex 4: Pair Extraordinaire -->
      <g transform="translate(144, 0)">
        <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="#090d16" stroke="#00e5ff" stroke-width="1.5" />
        <text x="18" y="26" font-family="'Fira Code', monospace" font-size="15" text-anchor="middle">👯</text>
      </g>

      <!-- Hex 5: Star Gazer -->
      <g transform="translate(192, 0)">
        <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="#090d16" stroke="#22c55e" stroke-width="1.5" />
        <text x="18" y="26" font-family="'Fira Code', monospace" font-size="15" text-anchor="middle">⭐</text>
      </g>

      <!-- Hex 6: Heart / Arctic -->
      <g transform="translate(240, 0)">
        <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="#090d16" stroke="#ff4081" stroke-width="1.5" />
        <text x="18" y="26" font-family="'Fira Code', monospace" font-size="15" text-anchor="middle">💖</text>
      </g>
    </g>

    <!-- View All Link -->
    <a href="https://github.com/dineshkumar0202?tab=achievements" target="_blank">
      <text x="310" y="115" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#00e5ff" text-anchor="end">View all →</text>
    </a>
  </g>
</svg>
