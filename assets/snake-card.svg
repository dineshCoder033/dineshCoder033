<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="snake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="hex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left/Main Container: Contribution Snake Card (Width 710) -->
  <g transform="translate(0, 5)">
    <rect width="710" height="230" rx="12" fill="url(#snake-bg)" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- Card Header -->
    <rect width="710" height="36" rx="12" fill="#21262d" />
    <rect y="20" width="710" height="16" fill="#21262d" />
    <text x="15" y="24" font-family="'Fira Code', monospace" font-size="13" font-weight="800" fill="#22c55e">
      🐍 CONTRIBUTION SNAKE
    </text>
    <text x="690" y="24" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#8b949e" text-anchor="end">
      "Let's eat some contributions!"
    </text>

    <!-- Embedded Snake Grid Vector / Placeholder Graphic -->
    <g transform="translate(15, 50)">
      <image href="images/github-contribution-grid-snake-dark.svg" width="680" height="165" preserveAspectRatio="xMidYMid meet" />
    </g>
  </g>

  <!-- Right Container: Achievements Card (Width 270) -->
  <g transform="translate(730, 5)">
    <rect width="270" height="230" rx="12" fill="url(#snake-bg)" stroke="#00bcd4" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Card Header -->
    <rect width="270" height="36" rx="12" fill="#21262d" />
    <rect y="20" width="270" height="16" fill="#21262d" />
    <text x="15" y="24" font-family="'Fira Code', monospace" font-size="13" font-weight="800" fill="#eab308">
      🏆 ACHIEVEMENTS
    </text>
    <a href="https://github.com/dineshkumar0202?tab=achievements" target="_blank">
      <text x="255" y="24" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="end">View all →</text>
    </a>

    <!-- Hexagonal Badges Grid -->
    <g transform="translate(25, 60)">
      <!-- Badge 1: Pull Shark -->
      <g transform="translate(0, 0)">
        <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="#161b22" stroke="#38bdf8" stroke-width="1.5" filter="url(#hex-glow)" />
        <text x="30" y="32" font-family="'Fira Code', monospace" font-size="20" text-anchor="middle">🦈</text>
        <text x="30" y="48" font-family="'Fira Code', monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">PULL SHARK</text>
      </g>

      <!-- Badge 2: Quickdraw -->
      <g transform="translate(75, 0)">
        <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="#161b22" stroke="#22c55e" stroke-width="1.5" filter="url(#hex-glow)" />
        <text x="30" y="32" font-family="'Fira Code', monospace" font-size="20" text-anchor="middle">⚡</text>
        <text x="30" y="48" font-family="'Fira Code', monospace" font-size="8" font-weight="700" fill="#22c55e" text-anchor="middle">QUICKDRAW</text>
      </g>

      <!-- Badge 3: YOLO -->
      <g transform="translate(150, 0)">
        <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="#161b22" stroke="#eab308" stroke-width="1.5" filter="url(#hex-glow)" />
        <text x="30" y="32" font-family="'Fira Code', monospace" font-size="20" text-anchor="middle">🎲</text>
        <text x="30" y="48" font-family="'Fira Code', monospace" font-size="8" font-weight="700" fill="#eab308" text-anchor="middle">YOLO</text>
      </g>

      <!-- Badge 4: Pair Extraordinaire -->
      <g transform="translate(37, 80)">
        <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="#161b22" stroke="#a855f7" stroke-width="1.5" filter="url(#hex-glow)" />
        <text x="30" y="32" font-family="'Fira Code', monospace" font-size="20" text-anchor="middle">👯</text>
        <text x="30" y="48" font-family="'Fira Code', monospace" font-size="8" font-weight="700" fill="#a855f7" text-anchor="middle">PAIR PRO</text>
      </g>

      <!-- Badge 5: Star Gazer -->
      <g transform="translate(112, 80)">
        <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="#161b22" stroke="#00bcd4" stroke-width="1.5" filter="url(#hex-glow)" />
        <text x="30" y="32" font-family="'Fira Code', monospace" font-size="20" text-anchor="middle">⭐</text>
        <text x="30" y="48" font-family="'Fira Code', monospace" font-size="8" font-weight="700" fill="#00bcd4" text-anchor="middle">STARGAZER</text>
      </g>
    </g>
  </g>
</svg>
